[package]
name = "pharma"
version = "0.2.110"
description = "Pharmacy Local Enforcer"
authors = ["Pharma Management Team"]
edition = "2021"
rust-version = "1.77.2"

[features]
# Commercial/default PHARMA never exposes the developer's signed historical
# maintenance CLI. Only a separate, deliberately opted-in support build can
# prepare authenticated disposable copy-only upgrade stages.
default = []
owner-maintenance-cli = []


# build-dependencies
[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }
base64 = "0.22.1"
url = "2.5.8"

[dependencies]
tauri = { version = "2.0.6", features = [] }
tauri-plugin-sql = { version = "2.0.2", features = ["sqlite"] }
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio"] }
futures-util = "0.3.34"
libsqlite3-sys = "=0.30.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bcrypt = "0.15"
uuid = { version = "1.8", features = ["v4", "serde"] }
tokio = { version = "1.35", features = ["full"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-dialog = "2.7.1"
ring = "0.17.14"
base64 = "0.22.1"
url = "2.5.8"
sha2 = "0.10.9"
reqwest = { version = "=0.13.3", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_System_Registry", "Win32_Storage_FileSystem"] }
