name: "Release"
on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    # Fail closed: no signed production artifact is distributed while the
    # privacy/authorization and licensing operations acceptance gates remain
    # open. Security lead must explicitly set this repository variable only
    # after independently approving the release checklist.
    if: ${{ vars.PHARMA_SECURITY_RELEASE_APPROVED == 'true' }}
    environment: pharma-production-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-2022]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Windows Rust toolchain
        uses: dtolnay/rust-toolchain@1.77.2
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Seed database
        run: npm run seed:db

      - name: Block bundled default owner credentials
        run: node scripts/check-commercial-release-seed.js

      - name: Block high production dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Run Tauri tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Import Windows code-signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'Authenticode code-signing certificate and password are required for a licensing-protected production release.'
          }
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -and
              -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            $certificatePath = Join-Path $env:RUNNER_TEMP 'pharma-code-signing.pfx'
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
            )
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $importedCertificates = Import-PfxCertificate `
              -FilePath $certificatePath `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $password
            Remove-Item -LiteralPath $certificatePath -Force
            $certificate = $importedCertificates |
              Where-Object { $_.HasPrivateKey } |
              Select-Object -First 1

            if ($certificate -and -not [string]::IsNullOrWhiteSpace($certificate.Thumbprint)) {
              "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              @{
                build = @{
                  # The Tauri builder reseeds through beforeBuildCommand.
                  # Check that final artifact again before binary packaging.
                  beforeBuildCommand = 'npm run seed:db && node scripts/check-commercial-release-seed.js && npm run build:tauri'
                }
                bundle = @{
                  windows = @{
                    certificateThumbprint = $certificate.Thumbprint
                    digestAlgorithm = 'sha256'
                    timestampUrl = 'http://timestamp.digicert.com'
                  }
                }
              } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath 'src-tauri/tauri.signing.conf.json' -Encoding utf8
            } else {
              throw 'Imported signing certificate has no accessible private key.'
            }
          }

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v1
        env:
          # PUBLIC Ed25519 verify key only. Issuer PRIVATE signing key stays
          # exclusively in the offline license authority, never CI binaries.
          PHARMA_LICENSE_VERIFY_KEY_B64: ${{ vars.PHARMA_LICENSE_VERIFY_KEY_B64 }}
          # Device-bound release requires a persisted hardware-backed key.
          PHARMA_LICENSE_DEVICE_MODE: tpm-v2
          # Only explicit "1" selects manually issued, no-Azure offline grants.
          PHARMA_LICENSE_OFFLINE_ONLY: ${{ vars.PHARMA_LICENSE_OFFLINE_ONLY }}
          PHARMA_LICENSE_AUTHORITY_URL: ${{ vars.PHARMA_LICENSE_AUTHORITY_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Pharma App v__VERSION__"
          releaseBody: "Desktop release requires TPM-backed device binding on supported Windows hardware, a separately issued Ed25519-signed lease, and an Authenticode-signed installer. Windows 7 is not supported by the TPM-required licensing tier. A production expiry, signing authority and renewal service remain operator prerequisites."
          # Keep artifacts non-public until both architectures have passed
          # local Authenticode checks and combined signed updater validation.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc --config src-tauri/tauri.signing.conf.json

      - name: Verify Windows installer signatures
        shell: pwsh
        run: |
          $installers = Get-ChildItem -LiteralPath 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle' -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.msi' }
          if (-not $installers) {
            throw 'No Windows installers were produced.'
          }
          if (-not $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
            throw 'Missing expected signing certificate thumbprint. Refusing unsigned release.'
          }
          if ($env:WINDOWS_CERTIFICATE_THUMBPRINT) {
            foreach ($installer in $installers) {
              $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
              if ($signature.Status -ne 'Valid') {
                throw "Invalid Authenticode signature for $($installer.FullName): $($signature.Status)"
              }
              if ($signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
                throw "Unexpected signer certificate for $($installer.FullName)."
              }
              if (-not $signature.TimeStamperCertificate) {
                throw "Missing Authenticode timestamp for $($installer.FullName)."
              }
            }
          }

  publish-windows-x86-tpm:
    name: Publish Windows x86 installer (TPM-required; not Windows 7)
    needs: publish-tauri
    environment: pharma-production-release
    permissions:
      contents: write
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Windows x86 Rust toolchain
        uses: dtolnay/rust-toolchain@1.77.2
        with:
          targets: i686-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Seed database
        run: npm run seed:db

      - name: Block bundled default owner credentials
        run: node scripts/check-commercial-release-seed.js

      - name: Block high production dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Test 32-bit Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --target i686-pc-windows-msvc

      - name: Build desktop frontend
        run: npm run build:tauri

      - name: Import certificate and create legacy build configuration
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $config = Get-Content -LiteralPath 'src-tauri/tauri.windows7.conf.json' -Raw | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $true
          # This architecture builds its frontend separately. Recheck its seed
          # immediately before Tauri bundles resources into the installer.
          $config.build.beforeBuildCommand = 'node scripts/check-commercial-release-seed.js'

          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'Production Windows x86 installer requires Authenticode certificate and password.'
          }
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -and
              -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            $certificatePath = Join-Path $env:RUNNER_TEMP 'pharma-code-signing.pfx'
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
            )
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $importedCertificates = Import-PfxCertificate `
              -FilePath $certificatePath `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $password
            Remove-Item -LiteralPath $certificatePath -Force
            $certificate = $importedCertificates |
              Where-Object { $_.HasPrivateKey } |
              Select-Object -First 1

            if ($certificate -and -not [string]::IsNullOrWhiteSpace($certificate.Thumbprint)) {
              "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              $config.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $certificate.Thumbprint
              $config.bundle.windows | Add-Member -NotePropertyName digestAlgorithm -NotePropertyValue 'sha256'
              $config.bundle.windows | Add-Member -NotePropertyName timestampUrl -NotePropertyValue 'http://timestamp.digicert.com'
            } else {
              throw 'Imported x86 signing certificate has no accessible private key.'
            }
          }

          $config | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath 'src-tauri/tauri.windows7.signing.conf.json' -Encoding utf8

      - name: Build and publish TPM-required Windows x86 installer
        uses: tauri-apps/tauri-action@v1
        env:
          PHARMA_LICENSE_VERIFY_KEY_B64: ${{ vars.PHARMA_LICENSE_VERIFY_KEY_B64 }}
          PHARMA_LICENSE_DEVICE_MODE: tpm-v2
          PHARMA_LICENSE_OFFLINE_ONLY: ${{ vars.PHARMA_LICENSE_OFFLINE_ONLY }}
          PHARMA_LICENSE_AUTHORITY_URL: ${{ vars.PHARMA_LICENSE_AUTHORITY_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseDraft: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis --target i686-pc-windows-msvc --config src-tauri/tauri.windows7.signing.conf.json

      - name: Verify Windows x86 installer signature
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath 'src-tauri/target/i686-pc-windows-msvc/release/bundle/nsis' -Filter '*-setup.exe' -File |
            Select-Object -First 1
          if (-not $installer) {
            throw 'No TPM-required Windows x86 installer was produced.'
          }
          if (-not $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
            throw 'No expected x86 certificate thumbprint; refusing unsigned release.'
          }
          if ($env:WINDOWS_CERTIFICATE_THUMBPRINT) {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            if ($signature.Status -ne 'Valid' -or
                $signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERTIFICATE_THUMBPRINT -or
                -not $signature.TimeStamperCertificate) {
              throw "Invalid Authenticode signature for $($installer.FullName)."
            }
          }

      - name: Verify combined x64 and x86 updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              gh release download ${{ github.ref_name }} --pattern latest.json --dir . --clobber *>&1 | Out-Null
              $manifest = Get-Content latest.json -Raw | ConvertFrom-Json
              $keys = @($manifest.platforms.PSObject.Properties.Name)
              if ($keys -contains 'windows-x86_64-nsis' -and $keys -contains 'windows-i686-nsis') {
                break
              }
            } catch {
              if ($attempt -eq 12) { throw }
            }
            if ($attempt -eq 12) {
              throw "Updater manifest is missing x64 or i686 NSIS entries: $($keys -join ', ')"
            }
            Start-Sleep -Seconds 5
          }

          foreach ($key in 'windows-x86_64-nsis', 'windows-i686-nsis') {
            $entry = $manifest.platforms.$key
            if ([string]::IsNullOrWhiteSpace($entry.url) -or [string]::IsNullOrWhiteSpace($entry.signature)) {
              throw "Updater manifest entry '$key' is incomplete."
            }
          }

      - name: Publish verified signed release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No release is published when the x64/x86 Authenticode or signed
          # updater checks fail; the draft stays private to maintainers.
          gh release edit '${{ github.ref_name }}' --draft=false
